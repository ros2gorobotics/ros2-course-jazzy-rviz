services:
  ros2:
    image: ghcr.io/ros2gorobotics/ros2-course-jazzy-rviz:latest
    container_name: ros2_jazzy_rviz

    stdin_open: true
    tty: true

    environment:
      DISPLAY: ${DISPLAY}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY}
      XDG_RUNTIME_DIR: /tmp/runtime-student
      QT_QPA_PLATFORM: xcb
      QT_X11_NO_MITSHM: "1"

    volumes:
      - ./workspace:/home/student/ros2_ws

      # WSLg GUI
      - /mnt/wslg:/mnt/wslg
      - /tmp/.X11-unix:/tmp/.X11-unix

    restart: unless-stopped
