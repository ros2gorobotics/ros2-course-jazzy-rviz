services:
  ros2:
    image: ros2-course-jazzy-rviz:latest
    container_name: ros2_jazzy_rviz

    privileged: true
    network_mode: host
    ipc: host

    stdin_open: true
    tty: true

    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"

    volumes:
      - ./workspace:/home/student/ros2_ws
      - /tmp/.X11-unix:/tmp/.X11-unix

    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
