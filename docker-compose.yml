services:
  ros2:
    image: ghcr.io/ros2gorobotics/ros2-course-jazzy-rviz:latest
    container_name: ros2_jazzy_rviz

    stdin_open: true
    tty: true
    
    # 1. เพิ่มโหมด privileged เพื่อให้มีสิทธิ์เข้าถึงฮาร์ดแวร์แบบไดนามิก
    privileged: true 

    environment:
      # ปรับให้ดึงค่าจากระบบของ WSL ก่อน หากไม่มีให้ใช้ค่าเริ่มต้น
      DISPLAY: ${DISPLAY:-:0}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-0}
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-/run/user/1000}
      QT_QPA_PLATFORM: "xcb"
      QT_X11_NO_MITSHM: "1"

    volumes:
      - ros2_course_workspace:/home/student/ros2_ws
      - /mnt/wslg:/mnt/wslg
      - /mnt/wslg/.X11-unix:/tmp/.X11-unix
      # 2. แมปโฟลเดอร์ /dev ทั้งหมดเข้ามา เพื่อให้มองเห็นอุปกรณ์ตอนเสียบสาย (Hot-plug)
      - /dev:/dev
      # แก้ไข: เพิ่ม /dev/shm กลับเข้ามาเพื่อป้องกันไม่ให้ GUI แครช
      - /dev/shm:/dev/shm

    # 3. ลบหรือคอมเมนต์ devices เดิมออกเพื่อไม่ให้เกิด Error ตอน Start
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0

    restart: unless-stopped

volumes:
  ros2_course_workspace:
